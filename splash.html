<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수산직불제 AI Splash</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c75bd;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
